<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>学生取消报名通知</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background-color: #2196F3; color: white; padding: 20px; text-align: center; }
        .content { padding: 20px; background-color: #f9f9f9; }
        .footer { padding: 20px; text-align: center; color: #666; }
        .highlight { color: #2196F3; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>学生取消报名通知</h1>
        </div>
        <div class="content">
            <p>尊敬的 <span class="highlight" th:text="${teacherName}">教师</span>，</p>
            <p>有学生取消了您讲座的报名，详情如下：</p>
            <ul>
                <li><strong>学生姓名：</strong><span class="highlight" th:text="${studentName}">学生姓名</span></li>
                <li><strong>讲座标题：</strong><span th:text="${lectureTitle}">讲座标题</span></li>
                <li><strong>开始时间：</strong><span th:text="${startTime}">开始时间</span></li>
                <li><strong>讲座地点：</strong><span th:text="${location}">讲座地点</span></li>
            </ul>
            <p>现在该讲座有了新的空余名额，可能会有其他学生报名参加。</p>
            <p>您可以登录系统查看最新的报名情况。</p>
        </div>
        <div class="footer">
            <p>此邮件由大学讲座管理系统自动发送，请勿回复。</p>
        </div>
    </div>
</body>
</html>
