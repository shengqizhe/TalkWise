<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>讲座提醒 - 讲师通知</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            background-color: #ffffff;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .header {
            text-align: center;
            border-bottom: 3px solid #007bff;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        .header h1 {
            color: #007bff;
            margin: 0;
            font-size: 28px;
            font-weight: bold;
        }
        .header .subtitle {
            color: #666;
            font-size: 16px;
            margin-top: 5px;
        }
        .content {
            margin-bottom: 30px;
        }
        .greeting {
            font-size: 18px;
            color: #333;
            margin-bottom: 20px;
        }
        .lecture-info {
            background-color: #f8f9fa;
            border-left: 4px solid #007bff;
            padding: 20px;
            margin: 20px 0;
            border-radius: 5px;
        }
        .lecture-info h2 {
            color: #007bff;
            margin-top: 0;
            font-size: 22px;
        }
        .info-item {
            margin: 10px 0;
            font-size: 16px;
        }
        .info-label {
            font-weight: bold;
            color: #555;
            display: inline-block;
            width: 80px;
        }
        .info-value {
            color: #333;
        }
        .reminder-notice {
            background-color: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 5px;
            padding: 15px;
            margin: 20px 0;
            text-align: center;
        }
        .reminder-notice .icon {
            font-size: 24px;
            color: #856404;
            margin-bottom: 10px;
        }
        .reminder-text {
            color: #856404;
            font-weight: bold;
            font-size: 16px;
        }
        .action-section {
            background-color: #e8f4fd;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
            text-align: center;
        }
        .action-title {
            color: #0056b3;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .action-list {
            text-align: left;
            color: #333;
            line-height: 1.8;
        }
        .action-list li {
            margin: 8px 0;
        }
        .footer {
            text-align: center;
            padding-top: 20px;
            border-top: 1px solid #eee;
            color: #666;
            font-size: 14px;
        }
        .system-info {
            margin-top: 15px;
            font-size: 12px;
            color: #999;
        }
        .highlight {
            color: #007bff;
            font-weight: bold;
        }
        .urgent {
            color: #dc3545;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 讲座提醒通知</h1>
            <div class="subtitle">讲师专用提醒</div>
        </div>
        
        <div class="content">
            <div class="greeting">
                尊敬的 <span class="highlight" th:text="${teacherName}">老师姓名</span> 老师，您好！
            </div>
            
            <div class="reminder-notice">
                <div class="icon">⏰</div>
                <div class="reminder-text">
                    您的讲座将在 <span class="urgent" th:text="${reminderMinutes}">30</span> 分钟后开始
                </div>
            </div>
            
            <div class="lecture-info">
                <h2>📖 讲座信息</h2>
                <div class="info-item">
                    <span class="info-label">讲座标题：</span>
                    <span class="info-value highlight" th:text="${lectureTitle}">讲座标题</span>
                </div>
                <div class="info-item">
                    <span class="info-label">开始时间：</span>
                    <span class="info-value" th:text="${startTime}">开始时间</span>
                </div>
                <div class="info-item">
                    <span class="info-label">讲座地点：</span>
                    <span class="info-value" th:text="${location}">讲座地点</span>
                </div>
            </div>
            
            <div class="action-section">
                <div class="action-title">🎯 讲座前准备提醒</div>
                <ul class="action-list">
                    <li>📋 检查讲座材料和演示文稿是否准备完毕</li>
                    <li>🎤 确认音响设备和投影设备工作正常</li>
                    <li>📱 准备好相关的教学辅助工具</li>
                    <li>👥 了解预期参与人数，做好互动准备</li>
                    <li>🚗 预留充足的交通时间，提前到达讲座地点</li>
                    <li>📞 确保联系方式畅通，以便处理突发情况</li>
                </ul>
            </div>
        </div>
        
        <div class="footer">
            <p>祝您讲座顺利！</p>
            <p><strong>大学讲座管理系统</strong></p>
            <div class="system-info">
                <p>这是一封自动发送的提醒邮件，请勿直接回复。</p>
                <p>如有疑问，请联系系统管理员。</p>
            </div>
        </div>
    </div>
</body>
</html>
